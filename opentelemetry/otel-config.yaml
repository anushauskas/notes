receivers:
  otlp:
    protocols:
      grpc:
      http:
  loki:
    protocols:
      http:
    use_incoming_timestamp: true
  prometheus:
    config:
      scrape_configs:
        - job_name: my.namespace/otelcol-contrib
          scrape_interval: 60s
          metrics_path: /metrics
          static_configs:
            - targets: 
                - 0.0.0.0:8888
              labels: 
                deployment_environment: test

processors:
  batch:
  attributes/fluentbit:
    actions: 
      - key: loki.attribute.labels
        value: level, job, deployment_environment, service_name, service_namespace
        action: insert
  resource/fluentbit:
    attributes:
      - action: insert
        key: loki.format
        value: raw
  resource:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: deployment.environment, service.name, service.namespace

  
exporters:
  logging:
    verbosity: detailed
  prometheus:
    endpoint: 0.0.0.0:8889
