extensions:
  health_check:

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: WARN
      encoding: "json"
      initial_fields: 
        service: "opentelemetry collector"
    metrics:
      level: basic
  pipelines:
    # traces:
    #   receivers: [otlp]
